spring:
  application:
    name: rail
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    password: ${PWD}
    username: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db.changelog/db.changelog-master.xml

app:
  scheduling:
    enabled: false
    optimization: true
    fixedDelay: 10000 #ms
    priceIncreasePercentage: 10.1
    optimize:
      exclusive-lock: true
rest:
  currency-service:
    host: http://localhost:8081
    methods:
      get-currency: /api/v1/currencies
    mock:
      enabled: false

  account-service:
    host: http://localhost:8082
    methods:
      get-accountNum: /api/v2/accountNum

  crm-service:
    host: http://localhost:8083
    methods:
      get-tin: /api/v3/tin

kafka:
  groupId: group1
  bootstrapAddress: localhost:9092

s3:
  credentials:
    accessKey: test
    secretKey: test
  endpoint: http://localhost:4566
  bucket-name: sample-bucket
  region: us-east-1
